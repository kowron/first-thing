<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szkielet osiowy w 4 dni</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  /* Zawsze jasny. Kolor tkanki (mięsień, kość, staw) znaczy lekcję jak zakładka na brzegu zeszytu. */
  --paper:#f6f7fb; --surface:#ffffff; --ink:#151a27; --ink2:#566076; --ink3:#96a0b5; --line:#e3e7f0;
  --accent:#0a8767; --on-accent:#ffffff; --accent-soft:#dcf5ec;
  --bone:#c27c00; --bone-soft:#fff2cf; --joint:#2b7be4; --joint-soft:#e2edff; --muscle:#e2503a; --muscle-soft:#ffe7e1;
  --star:#dc8400; --star-soft:#fff1d0; --bad:#d4382c; --bad-soft:#fdeae7;
  --latin:#8a6a1f;
  --m-z:#d9a21b; --m-s:#a3adbf; --m-b:#c27a45;
  --serif:"Literata Variable",Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --sans:"Instrument Sans Variable",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --tis:var(--accent); --tis-soft:var(--accent-soft);
  --sh:0 1px 2px rgba(21,26,39,.05),0 8px 24px -14px rgba(21,26,39,.22);
  color-scheme:only light;
}
.t-bone{--tis:var(--bone);--tis-soft:var(--bone-soft)}.t-joint{--tis:var(--joint);--tis-soft:var(--joint-soft)}.t-muscle{--tis:var(--muscle);--tis-soft:var(--muscle-soft)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16.5px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
i{font-family:var(--serif);font-style:italic;color:var(--latin);font-weight:400}
b{font-weight:650}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.12;font-weight:650}
h2{font-size:21px;line-height:1.2;font-weight:650}
h3{font-size:17px;line-height:1.3;font-weight:650}
p{margin:0}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}
.mut{color:var(--ink2)}.sm{font-size:14px;line-height:1.45}
.stack{display:flex;flex-direction:column;gap:14px}

/* górny pasek */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:6px;height:54px}
.brand{font-family:var(--serif);font-weight:650;font-size:17px;flex:1;background:none;border:0;padding:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar nav{display:flex;gap:2px}
.bar nav button{background:none;border:0;padding:8px 10px;border-radius:10px;font-size:15px;font-weight:550;color:var(--ink2)}
.bar nav button.on{color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.sbar .wrap{gap:14px}
.x{width:40px;height:40px;margin-left:-10px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.prog{flex:1;height:7px;border-radius:5px;background:var(--line);overflow:hidden}
.prog b{display:block;height:100%;background:var(--tis);border-radius:5px;transition:width .45s cubic-bezier(.3,.7,.2,1)}
.cnt{font-size:14px;color:var(--ink2);min-width:54px;text-align:right}
main{padding:22px 0 150px}
.stack:not(.still)>*:not(.dock):not(form){animation:rise .34s cubic-bezier(.2,.75,.25,1) both}
.stack:not(.still)>*:nth-child(2){animation-delay:.04s}.stack:not(.still)>*:nth-child(3){animation-delay:.08s}.stack:not(.still)>*:nth-child(4){animation-delay:.12s}.stack:not(.still)>*:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* przyciski */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 20px;border-radius:14px;border:1.5px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:650;font-size:16.5px;line-height:1.2;text-align:center;flex:1;transition:transform .12s ease,filter .12s ease,background .15s}
.btn:active{transform:scale(.975);filter:brightness(.96)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn.sml{flex:0 0 auto;min-height:40px;padding:8px 14px;font-size:15px}
.btn[disabled]{opacity:.45}
.link{background:none;border:0;padding:10px 6px;color:var(--ink2);font-size:15px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:22px 0 calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--paper) 30%)}
.dock .wrap{display:flex;flex-direction:column;gap:2px}
.dock .row{display:flex;gap:10px}
.dock .links{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.back{background:none;border:0;padding:6px 0;color:var(--ink2);font-size:15px;display:inline-flex;align-items:center;gap:4px}

/* strona główna */
.lead h1{font-size:34px}
.lead p{margin-top:8px;color:var(--ink2)}
.seg{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--line)}
.seg b{display:block;height:100%;transition:width .5s cubic-bezier(.3,.7,.2,1)}
.seg .d{background:var(--accent)}.seg .l{background:#7fd0b6}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--ink2);margin-top:8px}
.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--line)}
.legend .d:before{background:var(--accent)}.legend .l:before{background:#7fd0b6}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--tis)}
.hero[class*="t-"]{background:linear-gradient(180deg,var(--tis-soft),var(--surface) 62%)}
.hero.rev{background:linear-gradient(180deg,var(--accent-soft),var(--surface) 62%)}
.hero.plain{box-shadow:none}.hero.plain:before{display:none}
.hero h2{font-size:23px}
.hero p{margin-top:6px;font-size:15.5px;color:var(--ink2)}
.eb{font-size:13.5px;font-weight:650;color:var(--tis);margin-bottom:4px}
.bt{font:650 14px/1.3 var(--sans);color:var(--ink2);padding:18px 0 8px;border-bottom:1px solid var(--line)}
.list{display:flex;flex-direction:column}
.lrow{transition:background .15s;display:grid;grid-template-columns:5px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0}
.lrow .tab{align-self:stretch;border-radius:3px;background:var(--tis)}
.lrow .t{font-weight:600;line-height:1.3}
.lrow .d{font-size:13.5px;color:var(--ink2);margin-top:2px}
.ring{width:38px;height:38px;flex:none}
.ring circle{fill:none;stroke-width:3.5}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--tis);stroke-linecap:round;transition:stroke-dashoffset .4s ease}
.ring .fg2{stroke:var(--tis);opacity:.3;stroke-linecap:round}
.ring text{font:600 10.5px var(--sans);fill:var(--ink2)}
.ring.full .fg{stroke:var(--accent)}.ring.full text{fill:var(--accent);font-size:15px}

/* lekcja: lista pytań */
.urow{display:grid;grid-template-columns:22px 1fr 16px;gap:12px;align-items:start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0}
.urow .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink3);margin:6px 0 0 4px}
.urow .dot.l{border-color:var(--tis);background:var(--tis-soft)}
.urow .dot.d{border-color:var(--accent);background:var(--accent)}
.urow .t{font-weight:550;line-height:1.35}
.urow .d{font-size:13.5px;color:var(--ink2);margin-top:3px}
.urow .ch{color:var(--ink3);margin-top:3px}
.pri{display:inline-block;font:650 12.5px/1 var(--sans);border-radius:999px;padding:5px 10px;vertical-align:middle;white-space:nowrap}
.pri.p3{color:#8a5200;background:var(--star-soft)}
.pri.p1{color:var(--ink2);background:#eceff5}
.pri.new{color:var(--tis);background:var(--tis-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* pytanie i odpowiedź */
.crumb{font-size:13.5px;color:var(--ink3);line-height:1.35}
.ask{font:italic 500 22px/1.28 var(--serif);text-wrap:pretty}
.ask.sm2{font-size:18px;color:var(--ink2)}
.how{background:var(--tis-soft);border-radius:14px;padding:12px 14px;font-size:15.5px;display:flex;flex-direction:column;gap:2px}
.how b{color:var(--tis);font-size:13.5px}
.answer{display:flex;flex-direction:column;gap:4px}
.answer .g{font-size:13.5px;font-weight:650;color:var(--tis);padding:12px 0 2px}
.answer .g:first-child{padding-top:0}
.facts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.facts li{position:relative;padding-left:18px;line-height:1.5}
.facts li:before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--tis);opacity:.7}
.fus{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.fus details{border-bottom:1px solid var(--line)}
.fus summary{list-style:none;cursor:pointer;padding:12px 26px 12px 0;font-weight:550;position:relative;line-height:1.4}
.fus summary::-webkit-details-marker{display:none}
.fus summary:after{content:"+";position:absolute;right:4px;top:10px;font-size:20px;color:var(--ink3);font-weight:400}
.fus details[open] summary:after{content:"–"}
.fus details p{padding:0 0 14px;color:var(--ink2)}
.lbl{font-size:13.5px;font-weight:650;color:var(--ink2)}
.xnote{border-left:3px solid var(--star);padding:2px 0 2px 14px;font-size:14.5px;line-height:1.5;color:var(--ink2)}
.xnote b{display:block;font-size:13px;color:#8a5200}
.src{font-size:13px;color:var(--ink3)}
/* strony Bochenka */
.bk{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.45;color:var(--ink2)}
.bk>svg{color:var(--tis);margin-top:2px}
.bk b{display:block;font-size:13.5px;color:var(--tis);margin-bottom:1px}
.bk .pp{color:var(--ink);font-weight:650}
.nw{white-space:nowrap}
.pg{display:inline-block;font-size:12.5px;font-weight:600;color:var(--ink3);white-space:nowrap;letter-spacing:.01em}
.pgq{display:flex;gap:8px;align-items:center;font-size:14.5px;color:var(--ink2)}
.pgq svg{color:var(--tis);flex:none}
.pgq b{color:var(--ink);font-weight:650}
.cues{display:flex;flex-wrap:wrap;gap:6px}
.cues span{font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:4px 11px;color:var(--ink2);background:var(--surface)}
figure.sch{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 12px 10px}
figure.sch svg{display:block;width:100%;height:auto}
figure.sch figcaption{font-size:13px;color:var(--ink2);margin-top:10px;line-height:1.4;display:flex;flex-wrap:wrap;gap:4px 14px}
figure.sch .lg{white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
figure.sch .lg b{width:14px;height:4px;border-radius:2px;display:inline-block}
figure.sch .lg b.dash{height:0;border-top:2px dashed var(--ink3);border-radius:0}
figure.sch .cap{flex-basis:100%;color:var(--ink3);margin-top:2px}

/* pola */
textarea,input[type=text],input[type=search]{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;-webkit-appearance:none;appearance:none}
textarea{min-height:110px;resize:vertical;line-height:1.45}
textarea:focus,input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
::placeholder{color:var(--ink3)}
input.ok{border-color:var(--accent);background:var(--accent-soft)}
input.bad{border-color:var(--bad);background:var(--bad-soft)}
.mic{flex:0 0 auto;min-width:104px}
.mic.live{background:var(--bad);border-color:var(--bad);color:#fff}
.wq{font:650 26px/1.2 var(--serif);text-wrap:balance}

/* porównanie */
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.chk .hd{font-size:13.5px;font-weight:650;color:var(--tis);padding:16px 0 4px}
.chk .it{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;padding:12px 10px;margin:0 -10px;border-bottom:1px solid var(--line);border-radius:12px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s}
.chk .c{width:28px;height:28px;border-radius:50%;border:1.8px solid var(--accent);background:var(--accent);display:grid;place-items:center;transition:background .15s,border-color .15s,transform .18s cubic-bezier(.3,1.6,.5,1)}
.chk .c svg{width:17px;height:17px;grid-area:1/1}
.chk .c .ck{stroke:#fff}.chk .c .xx{stroke:#fff;opacity:0}
.chk .it.miss{background:var(--bad-soft);border-bottom-color:transparent}
.chk .it.miss .c{background:var(--bad);border-color:var(--bad);transform:scale(1.08)}
.chk .it.miss .c .ck{opacity:0}.chk .it.miss .c .xx{opacity:1}
.fb{border-radius:12px;padding:12px 14px;font-size:15.5px;line-height:1.45}
.fb.ok{background:var(--accent-soft)}.fb.no{background:var(--bad-soft)}
.fb ul{margin:6px 0 0;padding-left:18px}
.toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:var(--paper);border-radius:999px;padding:9px 16px;font-size:14.5px;font-weight:600;z-index:40;animation:toast 1.9s ease both;pointer-events:none;box-shadow:0 8px 24px -10px rgba(21,26,39,.5)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,6px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}

/* fiszka */
.fc{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:14px;min-height:200px;border-top:6px solid var(--tis)}
.fc.fu{border-top-color:var(--star)}
.fc .lb{font-size:13.5px;font-weight:650;color:var(--tis);display:flex;justify-content:space-between;gap:10px}
.fc.fu .lb{color:#8a5200}
.fc .lb span{font-weight:500;color:var(--ink3)}
.fc .qq{font:500 20px/1.45 var(--sans);text-wrap:pretty}
.fc .aa{border-top:1px dashed var(--line);padding-top:14px;font-size:17px;line-height:1.5;animation:reveal .32s cubic-bezier(.2,.75,.25,1) both}
@keyframes reveal{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* wynik */
.res{display:flex;gap:18px;align-items:center}
.res .rl{font-size:18px;margin-bottom:4px}
.bring{width:112px;height:112px;flex:none}
.bring circle{fill:none;stroke-width:9}
.bring .bg{stroke:var(--line)}
.bring .fg{stroke:var(--accent);stroke-linecap:round;animation:draw .9s cubic-bezier(.3,.7,.2,1) .15s both}
.bring text{font:650 26px var(--serif);fill:var(--ink)}
@keyframes draw{from{stroke-dashoffset:var(--c)}}
.rlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rlist li{display:flex;gap:12px;justify-content:space-between;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);font-size:15.5px;line-height:1.35}
.rlist li span{flex:none;font-size:13.5px;font-weight:650}
.rlist .ok{color:var(--accent)}.rlist .no{color:var(--bad)}

/* notatki, ustawienia */
.nl{display:flex;flex-direction:column}
.nl .lh{font:650 17px/1.3 var(--serif);padding:20px 0 6px;display:flex;gap:10px;align-items:center}
.nl .lh:before{content:"";width:5px;height:18px;border-radius:3px;background:var(--tis)}
.set{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line)}
.sw{flex:none;width:52px;height:32px;border-radius:999px;border:0;background:var(--line);position:relative;transition:background .15s}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw.on{background:var(--accent)}.sw.on:after{transform:translateX(20px)}
dl.how2{margin:0;display:grid;gap:12px}
dl.how2 dt{font-weight:650}
dl.how2 dd{margin:2px 0 0;color:var(--ink2);font-size:15.5px}
.refs{margin:0;padding-left:18px;display:grid;gap:8px;font-size:15px;color:var(--ink2)}
.refs a{color:var(--accent);font-weight:600}
.empty{color:var(--ink2);padding:18px 0}
/* znak w nagłówku */
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand span{overflow:hidden;text-overflow:ellipsis}
.logo{flex:none}
@media (max-width:520px){.brand span{display:none}.bar nav button{padding:8px 8px}}
@media (max-width:360px){.bar nav button{padding:8px 5px;font-size:14px}}

/* kręgosłup postępu: jeden krąg = jedno pytanie */
.spine{display:flex;align-items:center;gap:2px;height:30px}
.spine i{display:block;flex-basis:0;min-width:2px;border-radius:3px;background:var(--line);transition:background .3s}
.spine i.l{background:#7fd0b6}.spine i.d{background:var(--accent)}
.spcap{font-size:12.5px;color:var(--ink3);margin-top:4px}

/* karta gry na stronie głównej */
.hero.game{background:linear-gradient(180deg,var(--star-soft),var(--surface) 64%)}
.hero.game:before{background:var(--star)}
.hero.game .eb{color:#8a5200}
.btn.game-btn{background:var(--ink);border-color:var(--ink)}

/* wymienianka: wybór */
.g-lead h1{font-size:34px}
.g-lead p{margin-top:8px}
.g-eb{display:inline-flex;align-items:center;gap:6px;color:#8a5200}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;background:#e9edf4;border-radius:14px}
.seg3 button{border:0;background:none;border-radius:10px;padding:10px 6px;font-weight:600;font-size:15.5px;color:var(--ink2);transition:background .15s,color .15s}
.seg3 button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(21,26,39,.08),0 4px 12px -6px rgba(21,26,39,.25)}
.g-md{margin-top:-6px}
.g-note{background:var(--star-soft);border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.45;color:#6f4500}
.g-lists{display:flex;flex-direction:column;gap:10px}
.g-card{display:grid;grid-template-columns:28px minmax(0,1fr) 16px;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;transition:box-shadow .15s,transform .12s}
.g-card:hover{box-shadow:var(--sh)}.g-card:active{transform:scale(.99)}
.g-cm{display:grid;place-items:center}
.g-ct{display:flex;flex-direction:column;gap:2px;min-width:0}
.g-ct>b{font-size:16.5px;font-weight:650;line-height:1.3}
.g-cd{font-size:13.5px;color:var(--ink2)}
.g-cb{font-size:13px;color:var(--ink3)}.g-cb b{color:var(--ink);font-weight:650}
.g-card .ch{color:var(--ink3)}
.g-rl{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--ink2);margin-top:6px}
.g-rl span{display:inline-flex;align-items:center;gap:6px}
.medal{flex:none;display:block}.medal.none{opacity:.7}

/* wymienianka: przed startem */
.g-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g-stats div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.g-stats span{font-size:12.5px;color:var(--ink2)}
.g-stats b{font:650 21px/1.2 var(--serif);font-variant-numeric:tabular-nums}
.g-how{font-size:15px;line-height:1.5;color:var(--ink2)}
.g-how b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
.btn.g-go{font-size:18px}

/* wymienianka: plansza */
.g-board{display:flex;flex-direction:column;gap:16px}
.g-grp{display:flex;flex-direction:column;gap:8px}
.g-gh{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:650;color:var(--tis)}
.g-gc{color:var(--ink3);font-variant-numeric:tabular-nums}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{min-width:58px;min-height:34px;display:inline-flex;align-items:center;padding:6px 11px;border-radius:10px;border:1.5px dashed #cfd6e3;font-size:14.5px;line-height:1.3;color:var(--ink)}
.g-board.still .slot{min-width:46px;min-height:28px}
.slot.ok{border:1.5px solid transparent;background:var(--tis-soft);font-weight:560}
.slot.half{border-style:solid;border-color:var(--star)}
.slot.pop{animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{0%{transform:scale(.55);opacity:0}100%{transform:none;opacity:1}}

/* wymienianka: w trakcie */
.g-tl{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-clock{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 0 0}
.g-time{font:650 64px/1 var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.g-time small{font-size:.42em;font-weight:500;color:var(--ink3)}
.g-parbar{width:min(300px,80%);height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.g-parbar b{display:block;height:100%;width:0;border-radius:4px;background:var(--accent)}
.g-parbar b.over{background:var(--star)}
.g-parl{font-size:13px;color:var(--ink3)}
.g-mic{display:flex;align-items:center;gap:10px;min-height:42px;font-size:15px;color:var(--ink2)}
.g-mic .btn{margin-left:auto}
.g-dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--ink3)}
.g-dot.wait{background:var(--star)}
.g-dot.live{background:var(--bad);animation:pulse 1.4s infinite}
.g-dot.kb{width:auto;height:auto;background:none;color:var(--ink2)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(212,56,44,.45)}70%{box-shadow:0 0 0 10px rgba(212,56,44,0)}100%{box-shadow:0 0 0 0 rgba(212,56,44,0)}}
.g-heard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:50px;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.g-heard i{font-family:var(--sans);color:var(--ink3)}

/* wymienianka: wynik */
.g-res{display:flex;gap:18px;align-items:center}
.g-res .eb{color:var(--ink2)}
.g-pts{font:650 18px/1.1 var(--serif);margin:2px 0 6px}
.g-pts b{font-size:50px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.g-sum{display:flex;flex-direction:column;gap:14px}
.g-sg ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.g-sg li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;padding:8px 8px;margin:0 -8px;border-radius:10px;line-height:1.4}
.g-sg li[role=button]{cursor:pointer}
.g-sg li.no{background:var(--bad-soft)}
.g-ck{width:22px;height:22px;margin-top:1px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:var(--accent)}
.g-sg li.no .g-ck{background:transparent;border:2px solid var(--bad)}
.g-nm b{font-weight:600}
.g-tr summary{cursor:pointer;padding:6px 0;font-weight:600;color:var(--ink2)}
.g-tr p{font-size:14.5px;color:var(--ink2);overflow-wrap:anywhere}
/* łacina */
.lt-eb{color:var(--latin)}
.lt-seg{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--line)}
.lt-seg b{display:block;height:100%;transition:width .5s cubic-bezier(.3,.7,.2,1)}
.lt-seg .k{background:var(--latin)}.lt-seg .ok{background:var(--accent)}.lt-seg .todo{background:#f2b9ae}.lt-seg .left{background:var(--line)}
.legend .lk:before{background:var(--latin)}.legend .lok:before{background:var(--accent)}.legend .ltd:before{background:#f2b9ae}
.hero.lt-hero{background:linear-gradient(180deg,#f6efdf,var(--surface) 64%)}
.hero.lt-hero:before{background:var(--latin)}
.hero.lt-hero .eb{color:var(--latin)}
.lt-topics{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.lt-det summary{cursor:pointer;font-weight:600;color:var(--ink2);padding:6px 0}
.lt-det[open] summary{margin-bottom:6px}
.lt-tp{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.lt-tn{color:var(--ink3);font-variant-numeric:tabular-nums;flex:none}
.lt-links{display:flex;flex-wrap:wrap;gap:10px}
.lt-fc{cursor:pointer;border-top-color:var(--latin);animation:ltin .28s cubic-bezier(.2,.75,.25,1) both}
.lt-fc .lb{color:var(--latin)}
@keyframes ltin{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.lt-pl{font:650 27px/1.25 var(--serif);text-wrap:balance}
.lt-la{border-top:1px dashed var(--line);padding-top:14px;min-height:56px;font-size:21px;line-height:1.35}
.lt-la i{font-size:23px}
.lt-hide{font-size:15px;color:var(--ink3)}
.lt-alt{font-size:14px;color:var(--ink2);margin-top:4px}.lt-alt i{font-size:15px}
.btn.lt-n{background:var(--surface);color:var(--bad);border-color:#f0c4be}
.btn.lt-u{background:var(--surface);color:#8a5200;border-color:#f1d9a6}
.lt-intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:ltfade .25s ease both}
.lt-intro>div{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;animation:ltup .45s cubic-bezier(.2,.8,.25,1) both}
.lt-intro span{font:650 13px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--latin)}
.lt-intro b{font:650 32px/1.15 var(--serif);text-wrap:balance;max-width:16em}
.lt-intro.out{animation:ltfade .3s ease reverse both}
@keyframes ltfade{from{opacity:0}to{opacity:1}}
@keyframes ltup{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.lt-bank{display:flex;flex-direction:column}
.lt-bh{font-size:13.5px;font-weight:650;color:var(--latin);padding:16px 0 4px}
.lt-bi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.lt-bi>div{min-width:0}.lt-bi .link{flex:none;padding:6px 0}
/* wyjaśnienie własnymi słowami */
.wybtn{display:grid;grid-template-columns:minmax(0,1fr) 16px;gap:12px;align-items:center;width:100%;text-align:left;background:var(--joint-soft);border:0;border-radius:14px;padding:13px 14px;font-size:14.5px;line-height:1.45;color:var(--ink2)}
.wybtn b{display:block;color:var(--joint);font-size:15px;margin-bottom:1px}
.wybtn svg{color:var(--joint)}
.wy{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.wy h2{font-size:20px;margin-top:6px}
.wy p{line-height:1.6;max-width:62ch}
.wy figure.sch{margin:2px 0 4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:359px){.wrap{padding:0 16px}.bar nav button{padding:8px 6px;font-size:14px}.brand{font-size:16px}}
@media (min-width:720px){main{padding-top:34px}}
